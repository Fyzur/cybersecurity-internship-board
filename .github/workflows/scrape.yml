name: Scrape and Deploy

on:
  schedule:
    # Runs every 8 hours (00:00, 08:00, 16:00 UTC).
    - cron: "0 */8 * * *"
  workflow_dispatch: # Allow manual runs from the GitHub Actions UI.

# Required for GitHub Pages deployment.
permissions:
  contents: write
  pages: write
  id-token: write

# Only allow one deployment at a time; cancel in-progress runs if a new one starts.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scrapers
        # continue-on-error so a partial failure still deploys the site.
        continue-on-error: true
        run: python run_scrapers.py

      - name: Commit updated internships data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/internships.json
          # Only commit if something actually changed.
          git diff --staged --quiet || git commit -m "chore: update internships data [skip ci]"
          git push

      - name: Prepare Pages artifact
        # Copy the fresh JSON into site/ so the static site can fetch it.
        run: cp data/internships.json site/internships.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
